[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcsv"
version = "0.1.0"
description = "Git-like version control and synchronization between CSV files and Google Sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.8.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.30.0",
]

[project.scripts]
gitcsv = "gitcsv.cli.main:run"

[tool.setuptools.packages.find]
where = ["src"]
