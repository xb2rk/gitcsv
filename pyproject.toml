[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fccsv3"
version = "0.1.0a0"
description = "Safe CSV and Google Sheets synchronization for Craftland projects"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
sheets = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "requests>=2.0",
]

[project.scripts]
fccsv = "fccsv3.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
